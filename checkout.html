<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Tidepop</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <a href="index.html"><img src="images/brand/logo.png" alt="Tidepop" class="logo" /></a>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="checkout">
    <h1>Checkout</h1>

    <form id="checkout-form">
      <fieldset>
        <legend>Contact</legend>
        <label>Name <input type="text" name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
      </fieldset>

      <fieldset>
        <legend>Shipping Address</legend>
        <label>Address <input type="text" name="address" required /></label>
        <label>City <input type="text" name="city" required /></label>
        <label>Postcode <input type="text" name="postcode" required /></label>
        <label>Country <input type="text" name="country" required /></label>
      </fieldset>

      <div class="order-summary">
        <h2>Order Summary</h2>
        <div id="checkout-items"></div>
        <p>Total: <strong id="checkout-total">$0.00</strong></p>
      </div>

      <!-- Payment integration (e.g. Stripe) goes here -->
      <button type="submit" class="btn">Place Order</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Tidepop. All rights reserved.</p>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
